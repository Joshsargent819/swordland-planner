<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swordland Planner</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-style">
/* War-room console: ink-dark frame around a parchment battle map; zone colors carry all meaning. */
:root{
  --ink:#0d121b; --panel:#151c29; --panel2:#1b2433; --line:#2a3447; --text:#ece6d6; --muted:#98a2b5;
  --gold:#e3b34c; --red:#f06262; --ok:#4cc27e;
  --display:'Cinzel', Georgia, 'Times New Roman', serif;
  --body:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --cond:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(1200px 500px at 50% -200px,#1f2a40 0%,transparent 70%);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:18px 20px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.eyebrow{font-family:var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-size:13px;font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.4vw,38px);letter-spacing:.02em;line-height:1.1}
.topright{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.matchup{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.side{display:flex;flex-direction:column;font-family:var(--cond);line-height:1.1}
.side b{font-size:20px;letter-spacing:.03em}
.side span{color:var(--muted);font-size:13px}
.vs{font-family:var(--display);font-weight:800;color:var(--red);font-size:20px}
.edge{font-family:var(--cond);font-weight:700;color:var(--ok);border-left:1px solid var(--line);padding-left:12px;font-size:14px}
.who{display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:13px;color:var(--muted)}
.who b{color:var(--gold);font-family:var(--cond);font-size:15px;letter-spacing:.03em}

.planbar{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;justify-content:space-between}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:left;min-width:200px}
.tab b{font-family:var(--cond);font-size:18px;letter-spacing:.02em;display:flex;gap:8px;align-items:center}
.tab span{font-size:12.5px;color:var(--muted)}
.tab[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(180deg,#2a2716,var(--panel))}
.live{font-size:10.5px;font-weight:700;letter-spacing:.12em;background:var(--red);color:#fff;border-radius:999px;padding:1px 7px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.02em}
.btn:hover{border-color:#44516b}
.btn.gold{background:var(--gold);color:#1b1404;border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.matchtime{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.mt-main{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.mt-l{font-family:var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-size:13px;font-weight:700}
.mt-main b{font-family:var(--cond);font-size:20px;letter-spacing:.02em}
.mt-unset{color:var(--muted)}
.mt-c{color:var(--ok);font-family:var(--cond);font-weight:600;font-size:15px}
.tz{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.tz button{background:var(--panel2);border:0;padding:6px 14px;font-family:var(--cond);font-weight:600;font-size:15px;color:var(--muted)}
.tz button[aria-pressed="true"]{background:var(--gold);color:#1b1404}
table.sched{width:100%;border-collapse:collapse;font-size:14px}
table.sched th,table.sched td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.sched th{font-family:var(--cond);color:var(--muted);font-weight:600;letter-spacing:.04em}
table.sched td.t{font-family:var(--cond);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
table.sched tr.done td{opacity:.55}
.schedwrap{overflow-x:auto}
.langpick{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.langpick select{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-family:var(--cond);font-weight:600;font-size:15px}
.briefing .btext{font-size:15.5px;max-width:80ch}
.briefing .btext ul{margin:6px 0 10px;padding-inline-start:22px}
.briefing .btext li{margin:4px 0}
.briefing .btext p{margin:8px 0}
.briefing h3.bh{font-family:var(--cond);font-size:20px;letter-spacing:.04em;margin:16px 0 6px;color:var(--gold)}
.briefing h4.bh4{font-family:var(--cond);font-size:16px;margin:10px 0 4px}
.callout{background:#3a1d1d;border:1px solid #7a2e2e;border-radius:10px;padding:10px 14px;margin:10px 0;font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.02em}
.lzs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:8px 0}
.lz{border:1px solid var(--line);border-top:4px solid var(--zc);border-radius:10px;padding:8px 10px;background:var(--panel2)}
.lz h4{margin:0 0 4px;font-family:var(--cond);font-size:16px}
.lz ul{margin:0;padding-inline-start:18px;font-size:14px}
.blank{background:#5a2a2a;border-radius:4px;padding:0 6px}
.bedit{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}
.bctl{display:flex;flex-direction:column;gap:4px}
.bbody textarea,.bbody input,.bbody select,.addbar select{background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:14px;max-width:100%}
.bbody textarea{width:100%;resize:vertical;margin-top:4px}
.bbody .row,.addbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.addbar{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tplprev{font-size:14.5px;margin-bottom:6px}
.fi{display:inline-flex;align-items:center;gap:4px;font-size:13px}
.fl{font-family:var(--cond);font-weight:700;font-size:12.5px;color:var(--gold)}
.trb{font-family:var(--cond);font-weight:700;font-size:12px;background:#203a2a;color:#9be3b5;border-radius:6px;padding:1px 6px}
.conts{display:flex;flex-direction:column;gap:8px}
.cont{border:1px solid var(--line);border-inline-start:4px solid #8a6d2e;border-radius:10px;padding:8px 12px;background:var(--panel2)}
.cont.active{border-inline-start-color:var(--red);box-shadow:0 0 0 2px #f0626255;background:#2a1a1a}
.cif,.cthen{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;margin:3px 0}
.cthen ul{margin:0;padding-inline-start:18px}.cthen p{margin:0}
.ck{font-family:var(--cond);font-weight:800;font-size:12px;letter-spacing:.1em;background:#3a2f17;color:#f3d79a;border-radius:5px;padding:1px 6px;height:fit-content}
.ck.then{background:#203a2a;color:#9be3b5}
.cmeta{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cedit{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--ink)}
.cedit .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cedit select,.cedit textarea{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:14px;max-width:100%}
.actban{background:linear-gradient(90deg,#4a1414,#2a1414);border:1px solid #a33;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.actrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px}
.actmsg{font-family:var(--cond);font-weight:700;font-size:18px}
.switches{display:flex;flex-wrap:wrap;gap:6px}
.sw2{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px 3px 4px;font-size:13px;text-align:start}
.sw2 i{width:26px;height:15px;border-radius:999px;background:#3a4357;position:relative;flex:none}
.sw2 i::after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#cfd6e4;transition:left .15s}
.sw2.on{border-color:var(--red);background:#3a1d1d}.sw2.on i{background:var(--red)}.sw2.on i::after{left:13px}
.paused>.task,.paused>.note{opacity:.45}
.pausednote{margin:0 0 6px;font-weight:600;color:#f3d79a}
.livebar{background:#2a1414;border-color:#7a2e2e}
.myfab{position:fixed;inset-inline-end:16px;bottom:16px;z-index:40;background:var(--gold);color:#1b1404;border:0;border-radius:999px;padding:10px 16px;font-family:var(--cond);font-weight:700;font-size:16px;box-shadow:0 6px 20px #0008;display:none}
@media (max-width:900px){.myfab{display:block}}
.editbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#2a2312;border:1px solid #5d4b1d;border-radius:10px;padding:8px 12px}
.editbar .msg{flex:1 1 220px;font-size:14px;color:#f3dfae}
.editbar .msg b{color:var(--gold)}

.lookup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.lookup form{display:flex;flex-direction:column;gap:6px}
.lookup label{font-family:var(--display);font-weight:600;font-size:17px}
.lookrow{display:flex;gap:8px}
.lookrow input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:16px}
.mission{margin:0;color:var(--muted);font-size:14.5px;max-width:65ch}
.mission b{color:var(--text);font-family:var(--cond);letter-spacing:.06em;text-transform:uppercase;font-size:13px;margin-right:6px}

.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card>h2,.sechead h2{font-family:var(--display);font-size:18px;font-weight:600}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sechead p{margin:0;color:var(--muted);font-size:13px}
.mapcard{padding:10px}
.maptop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin:2px 4px 10px}
.phases{display:flex;gap:6px;flex-wrap:wrap}
.phase{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--cond);font-weight:600;font-size:14.5px}
.phase small{color:var(--muted);font-weight:500;margin-left:4px}
.phase[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.phase[aria-pressed="true"] small{color:#444}
.maptools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#2a2312;border:1px solid #5d4b1d;border-radius:10px;padding:6px 8px;margin:0 4px 10px}
.maptools .lbl{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#f3dfae;margin:0 4px}
.tool{border-radius:999px;padding:4px 11px;font-family:var(--cond);font-weight:600;font-size:14px;border:2px solid transparent;background:var(--panel2)}
.tool[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px #0006}
.maphint{flex-basis:100%;font-size:13px;color:#f3dfae;margin:2px 4px 0}
.mapbox{position:relative;border-radius:10px;overflow:hidden;border:1px solid #3b3220}
.mapbox svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.mapbox.arrange svg{touch-action:none}
.mapbox.arrange [data-building],.mapbox.arrange [data-landmark],.mapbox.arrange [data-marker]{cursor:grab}
.mapbox.place svg{cursor:copy}
.mapbox.paint [data-cell],.mapbox.paint [data-building]{cursor:crosshair}
[data-cell]{cursor:pointer}
[data-building]{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:10px 6px 2px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend button{background:none;border:0;padding:0;color:var(--text);display:inline-flex;gap:6px;align-items:center;font-size:13.5px}
#tip{position:fixed;z-index:50;pointer-events:none;background:#0b0f17f0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;max-width:260px;display:none;box-shadow:0 8px 24px #0008}
#tip b{font-family:var(--cond);font-size:15px;letter-spacing:.02em}

.panel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.panel h3{font-family:var(--display);font-size:20px;font-weight:600}
.panel .sub{color:var(--muted);font-size:13px;margin:2px 0 10px}
.panel section{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.panel h4,.zcard h4{margin:0 0 6px;font-family:var(--cond);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.04em}
.st-combatant{background:#20304a;color:#cfe0ff}
.st-sub{background:#3a2f17;color:#f3d79a}
.st-bench{background:#2a2f39;color:var(--muted)}
.zbanner{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;border-radius:10px;padding:10px 12px;margin:8px 0}
.zbanner b{font-family:var(--display);font-size:19px}
.zbanner span{font-family:var(--cond);font-size:15px;opacity:.95}
.task{display:grid;grid-template-columns:auto 1fr;gap:8px;margin:6px 0;font-size:14.5px}
.task .when{font-family:var(--cond);font-weight:700;font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;max-width:150px;align-self:start}
.note{font-size:13.5px;color:var(--muted)}
.warn{display:flex;gap:8px;font-size:14px;margin:5px 0}
.warn i{font-style:normal;width:18px;flex:none;text-align:center}
.w-bad i{color:var(--red)} .w-info i{color:var(--gold)} .w-ok i{color:var(--ok)}
table.counts{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.counts th,table.counts td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line)}
table.counts th:first-child,table.counts td:first-child{text-align:left}
table.counts th{font-family:var(--cond);color:var(--muted);font-weight:600;letter-spacing:.04em}
table.counts tr:last-child td{border-bottom:0;font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 7px;font-size:14px;line-height:1.3;max-width:100%}
.chip:hover{border-color:#5a6886}
.chip.on{border-color:var(--gold);box-shadow:0 0 0 2px #e3b34c55}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.chip em{font-style:normal;font-family:var(--cond);font-weight:700;font-size:12px;background:#3a2f17;color:#f3d79a;border-radius:4px;padding:0 5px}
.chip[draggable="true"]{cursor:grab}
.dot{width:10px;height:10px;border-radius:50%;background:#59606e;flex:none;display:inline-block}

.rosters{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.zcard{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--zc);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.zcard header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.zcard header button{background:none;border:0;padding:0;font-family:var(--display);font-size:18px;font-weight:600;color:var(--zc);text-align:left}
.zcard .meta{font-family:var(--cond);color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.zcard .flag{font-family:var(--cond);font-weight:700;font-size:13px;color:#f3d79a;background:#3a2f17;border-radius:6px;padding:2px 8px;align-self:flex-start}
.addzone{border:2px dashed var(--line);border-radius:12px;background:transparent;color:var(--muted);font-family:var(--cond);font-weight:600;font-size:16px;min-height:120px}
.addzone:hover{border-color:var(--gold);color:var(--gold)}
.leadrow{display:grid;grid-template-columns:104px minmax(0,1fr);gap:6px;align-items:center;font-size:14px}
.leadrow.stack{grid-template-columns:1fr;gap:4px}
.leadrow .bn{font-family:var(--cond);font-weight:600;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;margin:0;font-style:italic}
.dropzone.over{outline:2px dashed var(--gold);outline-offset:3px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.sublist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.subrow{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px;align-items:center;font-size:13.5px}
.subrow .n{font-family:var(--cond);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.subrow .cv{display:block;color:var(--muted);font-size:12.5px;margin:2px 0 0 4px}
.rot{width:100%;border-collapse:collapse;font-size:14px}
.rot td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.rot .arrow{color:var(--gold);font-weight:700;text-align:center;width:22px}
.rot td:first-child{white-space:nowrap}
@media (max-width:520px){.rot .chips{flex-wrap:wrap}}
.rot .when{font-family:var(--cond);font-weight:600;color:var(--muted);white-space:nowrap;text-align:right}
.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ph{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ph .t{font-family:var(--cond);font-weight:700;color:var(--gold);font-size:14px;letter-spacing:.04em}
.ph h3{font-family:var(--cond);font-size:18px;margin:2px 0 6px}
.ph ul{margin:0;padding-left:18px;font-size:14px}
.ph li{margin:3px 0}
.orders{margin:0;padding-left:22px;font-size:14.5px}
.orders li{margin:5px 0}
.orders li::marker{font-family:var(--cond);font-weight:700;color:var(--gold)}

.ed{display:flex;flex-direction:column;gap:8px}
.ed .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ed label{font-size:13px;color:var(--muted)}
.ed input,.ed select,.modal input,.modal select,.modal textarea{background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:14px;max-width:100%}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:13px}
.mv{border-radius:999px;padding:3px 10px;font-family:var(--cond);font-weight:600;border:1px solid var(--line);background:var(--panel2);font-size:14px}
.mv[disabled]{opacity:.4}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px #000}
.bcheck{display:flex;align-items:center;gap:8px;font-size:14px}
.bcheck small{color:var(--muted)}
.pairlist{display:flex;flex-direction:column;gap:4px;margin:4px 0}
.pairlist div{display:flex;gap:6px;align-items:center;font-size:14px}
.pairlist b{font-family:var(--cond);color:var(--gold);width:22px}

.modal-bg{position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:900px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-family:var(--display);font-size:20px}
.modal .f{display:flex;flex-direction:column;gap:4px}
.modal .f label{font-size:13px;color:var(--muted)}
.modal textarea{min-height:90px;width:100%;resize:vertical}
.modal .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.modal .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.modal input[data-set],.modal select[data-set]{padding:4px 6px;font-size:13.5px}
table.roster td{padding:5px 6px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0b0f17;border:1px solid var(--gold);color:var(--text);border-radius:10px;padding:10px 16px;z-index:70;font-size:14px;display:none;max-width:90vw}
footer{color:var(--muted);font-size:12.5px;text-align:center}
details.bench summary{cursor:pointer;font-family:var(--display);font-size:17px}
details.bench .chips{margin-top:10px}

@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .panel{position:static;max-height:none}
  .two,.lookup{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .wrap{padding:12px 16px 40px}
  .sublist{grid-template-columns:minmax(0,1fr)}
  .tab{min-width:0;flex:1}
  .modal .grid3,.modal .grid2{grid-template-columns:1fr}
  .matchup{width:100%;justify-content:space-between}
  .who{align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.3}}
</style>

  o+='<option value="co:'+b.id+'"'+(cur==='co:'+b.id?' selected':'')+'>Co-Lead · '+esc(b.name)+'</option>';});return o;}
function swapPlayers(pl,a,b){function w(x){return x===a?b:x===b?a:x;}function wk(obj){if(!obj)return obj;var n={};Object.keys(obj).forEach(function(k){n[w(k)]=obj[k];});return n;}

 if(rows.length){L.push('🔁 ROTATIONS');L=L.concat(rows);L.push('');}
